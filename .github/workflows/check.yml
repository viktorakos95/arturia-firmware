name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -B -m unittest discover -s tests -v
      - run: python3 -B map/render.py --check
      - run: python3 -B tools/check_publication.py
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld
      - run: make -C device/tests test
      - run: python3 -B device/build.py --link-only
